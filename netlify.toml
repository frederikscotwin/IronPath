# Static site — no build step. Connect this repo to Netlify (or Cloudflare Pages)
# for auto-deploy on every push, so all installed copies update on next launch.
[build]
  publish = "."
  command = ""

# Serverless function for hands-off Strava token refresh (keeps your client
# secret off the browser). Set STRAVA_CLIENT_ID + STRAVA_CLIENT_SECRET in
# Site settings → Environment variables. Endpoint: /.netlify/functions/strava-oauth
[functions]
  directory = "netlify/functions"

# Never long-cache the service worker or manifest, so updates propagate promptly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
