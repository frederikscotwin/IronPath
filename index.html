<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IronPath</title>
  <meta name="description" content="Personal triathlon training — plan, log, and analyze your road to Ironman.">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IronPath">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span class="brand-name">IronPath</span>
    </div>
    <div class="header-right">
      <div class="header-goal" id="headerGoal"></div>
      <button class="gear" id="gearBtn" aria-label="Setup" title="Setup">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view"><div class="loading">Loading…</div></main>

  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <button class="tab" data-tab="home" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Home</span></button>
    <button class="tab" data-tab="log" aria-label="Log">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span>Log</span></button>
    <button class="tab" data-tab="plan" aria-label="Plan">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Plan</span></button>
    <button class="tab" data-tab="coach" aria-label="Coach">
      <svg viewBox="0 0 24 24"><path d="M12 14a6 6 0 1 0-6-6"/><path d="M12 14l4-4"/><circle cx="12" cy="14" r="1.4"/></svg><span>Coach</span></button>
    <button class="tab" data-tab="stats" aria-label="Stats">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Stats</span></button>
    <button class="tab" data-tab="ai" aria-label="AI">
      <svg viewBox="0 0 24 24"><path d="M12 3l2.2 4.6L19 9l-4 3.4L16 18l-4-2.6L8 18l1-5.6L5 9l4.8-1.4z"/></svg><span>AI</span></button>
  </nav>

  <div id="toast" class="toast" hidden></div>
  <input type="file" id="fileInput" accept=".fit,.tcx,.gpx" multiple hidden>
  <input type="file" id="backupInput" accept=".json,application/json" hidden>

  <script type="module" src="js/app.js"></script>
  <noscript>IronPath needs JavaScript enabled.</noscript>
</body>
</html>
